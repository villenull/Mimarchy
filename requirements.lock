# The exact Python packages install.sh is allowed to fetch, pinned by version
# AND by the sha256 of the artifacts PyPI serves. install.sh installs this file
# with `pip install --require-hashes`, which refuses anything that does not
# match — so what lands in the venv is fixed by the commit that shipped this
# file, not by whatever PyPI resolves to on install day. That is the property
# the marketplace review needs: the reviewed commit fully determines the
# installed code.
#
# Both the wheel and the sdist hash are listed for each pin, so the lock still
# holds anywhere pip falls back to building from source.
#
# To bump a pin: change the version, take the new sha256 values from
#   https://pypi.org/pypi/<package>/<version>/json   (urls[].digests.sha256)
# and keep tests/test_install_inputs.py green.

# Toolchain. pip is brought to a known version instead of "latest"; setuptools
# is what builds the editable install under --no-build-isolation, so it has to
# be in the venv and is locked like everything else.
